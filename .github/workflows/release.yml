name: Windows installer

# Releases are Linux only for now (`./gradlew publishRelease` publishes the .deb and .AppImage), so this no longer
# runs on the release tag. Run it by hand against an existing tag to build the Windows installer (jpackage app
# image + NSIS) on a Windows runner and attach it to that release. To bring Windows back into every release,
# restore the trigger: `push: { tags: ['v*'] }`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - run: choco install nsis -y --no-progress
        shell: pwsh
      - run: .\gradlew.bat test packageExe
        shell: pwsh
      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem build/distributions/*.exe | Select-Object -First 1
          # publishRelease creates the release right after pushing the tag; wait for it to appear.
          for ($i = 0; $i -lt 40; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          gh release upload $tag $exe.FullName --clobber
