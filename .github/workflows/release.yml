name: Windows installer

# `./gradlew publishRelease` (run on the Linux dev machine) pushes tag v<version> and creates the GitHub release
# with the .deb and .AppImage. This workflow reacts to that tag: it builds the Windows installer (jpackage app
# image + NSIS) on a Windows runner and attaches it to the same release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - run: choco install nsis -y --no-progress
        shell: pwsh
      - run: .\gradlew.bat test packageExe
        shell: pwsh
      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem build/distributions/*.exe | Select-Object -First 1
          # publishRelease creates the release right after pushing the tag; wait for it to appear.
          for ($i = 0; $i -lt 40; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          gh release upload $tag $exe.FullName --clobber
